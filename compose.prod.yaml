services:
  proxy:
    build:
      context: ./proxy
      dockerfile: dockerfile
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-example.com}
      FRONTEND_URL: ${FRONTEND_URL:-frontend:80}
      TEST_FRONTEND_URL: ${TEST_FRONTEND_URL:-test-frontend:4000}
      API_URL: ${API_URL:-backend:5000}
      AUTH_URL: ${AUTH_URL:-auth:5050}
    volumes:
      - ${LETSENCRYPT_PATH:-/etc/letsencrypt}:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
      - auth
    networks:
      - grader-network

  backend:
    image: ghcr.io/cu-devclub/graderv1:api-latest
    container_name: backend
    restart: unless-stopped
    volumes:
      - ~/grader/files:/files
    depends_on:
      - mysql
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PORT: "5000"
      HOST: "0.0.0.0"
      DEV: "False"
      DBHOST: mysql
      DBUSER: ${DB_USER:-grader}
      DBPASS: ${DB_PASSWORD:-graderpassword}
      DBNAME: ${DB_NAME:-grader_dev}
      DOMAIN: ${DOMAIN:-https://sci.cugrader.com}
      PUBKEY: ${ASSIGNMENT_RSA_PUBLIC_KEY:-${PUBKEY}}
      PRIKEY: ${ASSIGNMENT_RSA_PRIVATE_KEY:-${PRIKEY}}
    networks:
      - grader-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  frontend:
    image: ghcr.io/cu-devclub/graderv1:frontend-latest
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - grader-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  auth:
    image: ghcr.io/cu-devclub/graderv1:auth-latest
    container_name: auth
    restart: unless-stopped
    environment:
      COOKIE_SECRET: ${SESSION_COOKIE_SECRET_KEY:-${COOKIE_SECRET}}
      PUBKEY: ${AUTHEN_RSA_PUBLIC_KEY:-${PUBKEY}}
    volumes:
      - ${CLIENT_SECRETS_PATH:-./auth/client_secrets.json}:/usr/src/app/client_secrets.json:ro
    networks:
      - grader-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"