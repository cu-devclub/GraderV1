services:
  mysql:
    volumes:
      - ~/grader/test/db:/var/lib/mysql

  db-migrator:
    build:
      context: ./db
      dockerfile: Dockerfile
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      DB_NAME: ${DB_NAME:-grader_dev}
      FORCE_INIT: ${FORCE_INIT:-false}
    restart: "no"
    depends_on:
      - mysql
    networks:
      - grader-network

  backend:
    build:
      context: ./api
      dockerfile: dockerfile
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      DEV: ${DEV:-true}
      HOST: "0.0.0.0"
      PORT: "5000"
      DOMAIN: ${DOMAIN:-sci.example.com}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DBHOST: ${DB_HOST:-mysql}
      DBUSER: ${DB_USER:-grader}
      DBPASS: ${DB_PASSWORD:-graderpassword}
      DBNAME: ${DB_NAME:-grader_dev}
      PUBKEY: ${ASSIGNMENT_RSA_PUBLIC_KEY}
      PRIKEY: ${ASSIGNMENT_RSA_PRIVATE_KEY}
    volumes:
      - ${FILES_STORAGE:-~/grader/files}:/files
    depends_on:
      - mysql
      - db-migrator
    networks:
      - grader-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        REACT_APP_HOST: ${REACT_API_HOST:-http://localhost:5000/api}
        REACT_APP_DEV: ${REACT_APP_DEV:-true}
    environment:
      REACT_APP_HOST: ${REACT_API_HOST:-http://localhost:5000/api}
      REACT_APP_DEV: ${REACT_APP_DEV:-true}
      PORT: 3000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      WDS_SOCKET_PORT: "0"
    volumes:
      - ./frontend/src:/app
      - /app/node_modules
    ports:
      - "${PORT:-3000}:3000"
    stdin_open: true
    tty: true
    depends_on:
      - backend
    networks:
      - grader-network